# Cache-Control por URI en vez de un `add_header` por location: en nginx, un
# `add_header` dentro de un location descarta TODOS los heredados del server, y
# los encabezados de seguridad de abajo desaparecerían justo en index.html y en
# los assets (#113). No agregues `add_header` dentro de un location.
map $uri $cache_control {
    # index.html no tiene hash en el nombre y es lo que decide qué chunks con
    # hash pide el navegador — si queda cacheado, sigue apuntando a chunks
    # viejos (con un VITE_API_BASE_URL viejo horneado adentro) después de un
    # rebuild. Las rutas de la SPA también terminan acá vía try_files.
    /index.html                                    "no-cache";
    # Cache agresivo para los assets con hash en el nombre (los genera Vite)
    ~*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$  "public, immutable";
    # Vacío = nginx no emite el header.
    default                                        "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control;

    # --- Encabezados de seguridad (#113, SEG-FE-02) -------------------------
    # `always`: también en 404/5xx, que son las respuestas que un atacante provoca.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS vive acá y no en Traefik (que termina el TLS) porque este es el único
    # proxy con configuración versionada. Sin includeSubDomains: el VPS de Dokploy
    # comparte dominio con proyectos ajenos. Si se agrega en Traefik, quitarlo acá.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP en Report-Only: las violaciones salen en la consola del navegador y no se
    # bloquea nada. Pasar a `Content-Security-Policy` cuando login, API, logos,
    # reCAPTCHA y push corran limpios. El Dockerfile reemplaza la variable API_ORIGIN
    # por el origen de VITE_API_BASE_URL (connect-src de la API, img-src de logos).
    #   reCAPTCHA v2: script-src y frame-src según la guía de CSP de Google.
    #   FCM: firebaseinstallations + fcmregistrations al pedir el token de push.
    #   style-src 'unsafe-inline': Ionic inyecta <style> en tiempo de ejecución.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${API_ORIGIN}; font-src 'self' data:; connect-src 'self' ${API_ORIGIN} https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (necesario porque Ionic/React manejan el ruteo en el cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
    }
}
